<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Houses - House Renting System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">
</head>
<body class="app-shell">
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top app-navbar">
        <div class="container">
            <a class="navbar-brand" href="/index.html">House Renting System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/index.html">Houses</a></li>
                    <li class="nav-item d-none" id="addHouseNavItem"><a class="nav-link" href="/add-house.html">Add House</a></li>
                    <li class="nav-item d-none" id="myHousesNavItem"><a class="nav-link active" href="/my-houses.html">My Houses</a></li>
                </ul>
                <div class="d-flex gap-2 align-items-center" id="guestActions">
                    <button class="btn btn-sm btn-outline-light" id="openLoginBtn">Login</button>
                    <button class="btn btn-sm btn-light" id="openRegisterBtn">Register</button>
                </div>
                <div class="d-flex gap-2 align-items-center d-none" id="userActions">
                    <span id="authState" class="badge text-bg-success">Logged In</span>
                    <button class="btn btn-sm btn-outline-light" id="logoutBtn">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container main-wrap">
        <div id="messageBox" class="alert d-none mb-4" role="alert"></div>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h2 class="h3 mb-0">My Houses</h2>
            <a href="/index.html" class="btn btn-outline-secondary">Back to Houses</a>
        </div>
        <div class="d-flex flex-wrap gap-2 mb-3">
            <input type="search" id="myHousesSearchInput" class="form-control" placeholder="Search by title or address">
            <button class="btn btn-primary" id="myHousesSearchBtn">Search</button>
            <button class="btn btn-outline-secondary" id="myHousesClearBtn">Clear</button>
        </div>
        <div id="myHousesGrid" class="row g-4"></div>
        <div id="myHousesPagination" class="d-flex justify-content-center align-items-center gap-2 mt-4"></div>
    </main>

    <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="authModalTitle">Login</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm" class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="loginEmail" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="loginPassword" required>
                        </div>
                        <div class="col-12">
                            <button class="btn btn-primary w-100" type="submit">Login</button>
                        </div>
                    </form>

                    <form id="registerForm" class="row g-3 d-none">
                        <div class="col-12">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="registerUsername" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="registerEmail" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="registerPassword" required minlength="6">
                        </div>
                        <div class="col-12">
                            <button class="btn btn-success w-100" type="submit">Register</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editHouseModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit House</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editHouseForm" class="row g-3">
                        <input type="hidden" id="editHouseId" />
                        <div class="col-12 col-md-6">
                            <label class="form-label">Title</label>
                            <input type="text" class="form-control" id="editTitle" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label">Address</label>
                            <input type="text" class="form-control" id="editAddress" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Image Url</label>
                            <input type="url" class="form-control" id="editImageUrl" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="editDescription" rows="3" required></textarea>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label">Price Per Month</label>
                            <input type="number" class="form-control" id="editPricePerMonth" min="0" step="0.01" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label">Category</label>
                            <select id="editCategory" class="form-select">
                                <option value="1">SingleBedroom</option>
                                <option value="2">DoubleBedroom</option>
                                <option value="3">SingleFamily</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <button class="btn btn-primary" type="submit">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth-roles.js?v=1"></script>
    <script src="/js/my-houses.js?v=3"></script>
</body>
</html>
